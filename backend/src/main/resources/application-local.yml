# Zero-setup profile: runs with an in-memory database, no Supabase needed.
# Data disappears when you stop the app. Use it to check everything works.
#   mvn spring-boot:run "-Dspring-boot.run.profiles=local"
spring:
  datasource:
    url: jdbc:h2:mem:bci;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  bootstrap:
    device-api-key: local-demo-device-key
    seed-demo-data: true

logging:
  level:
    com.bcilab.attendance: DEBUG
